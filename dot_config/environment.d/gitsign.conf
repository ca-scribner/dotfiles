# Point gitsign at gitsign-credential-cache for apps started from the desktop
# session, which don't read .zshrc. Keep the socket path in sync with .zshrc and
# the systemd socket unit (see `just install-gitsign`).
GITSIGN_CREDENTIAL_CACHE=${XDG_CACHE_HOME:-$HOME/.cache}/sigstore/gitsign/cache.sock
